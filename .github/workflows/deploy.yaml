name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
jobs:
  run:
    uses: lehigh-university-libraries/gha/.github/workflows/linderman-deploy.yaml@60c5d3a7a8f89290bbe0db056a0116855f59bb6c # main
    with:
      url: https://apps-${{ inputs.environment }}.lib.lehigh.edu/_rollout
    permissions:
      contents: read
      id-token: write
